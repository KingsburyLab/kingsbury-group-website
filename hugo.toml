baseURL = "https://kingsbury.princeton.edu/"
title = "Kingsbury Research Group"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 30

theme = "beautifulhugo"

[pagination]
  pagerSize = 5

[taxonomies]
  category = "categories"
  tag = "tags"
  publication_type = "publication_types"
  author = "authors"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[markup.highlight]
  noClasses = false

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.renderer]
  unsafe = true

[Params]
  subtitle = "Ion-selective materials for clean water and clean energy"
  mainSections = ["post"]
  favicon = "/img/princeton_lab_logo.svg"
  dateFormat = "January 2, 2006"
  commit = false
  rss = true
  readingTime = false
  wordCount = false
  colorScheme = "light"
  mathEngine = "katex"
  socialShare = false
  showRelatedPosts = false
  showPostNav = false
  headerImgStyle = "big"
  toc = false

  [Params.author]
    name = "Kingsbury Research Group"
    email = "kingsbury@princeton.edu"
    twitter = "kingsburylab"
    github = "KingsburyLab"

  [Params.search]
    provider = "fuse"

