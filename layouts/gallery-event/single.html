{{ define "header" }}
  <header class="header-section">
    <div class="intro-header no-img">
      <div class="container">
        <div class="row">
          <div class="col-md-10 offset-md-1">
            <div class="page-heading">
              <h1>{{ .Title }}</h1>
              <hr class="small">
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
{{ end }}

{{ define "main" }}
  <main class="container gallery-event-page" role="main">
    <div class="row">
      <div class="col-md-10 offset-md-1">
        <p class="gallery-event-date">{{ .Date.Format "January 2006" }}</p>
        <div class="gallery-event-grid">
          {{ range .Params.gallery_images }}
            <a href="{{ .src }}" aria-label="Open full-size image: {{ .alt }}">
              <img src="{{ .src }}" alt="{{ .alt }}" loading="lazy">
            </a>
          {{ end }}
        </div>
        <p class="gallery-event-back"><a href="{{ "/gallery/" | relURL }}">Back to Gallery</a></p>
      </div>
    </div>
  </main>
{{ end }}
